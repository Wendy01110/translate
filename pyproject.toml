[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-translate"
version = "0.1.0"
description = "Local AI translation for selected text and screen OCR."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx",
  "pydantic",
  "pydantic-settings",
  "pynput",
  "Pillow; sys_platform == 'win32'",
  "PySide6>=6.8,<7; sys_platform == 'win32'",
  "pywin32; sys_platform == 'win32'",
  "pyobjc-framework-Cocoa; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz; sys_platform == 'darwin'",
  "pyobjc-framework-Vision; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]
local-ocr = [
  "paddleocr==3.7.0",
  "paddlepaddle==3.3.0",
]

[project.scripts]
ai-translate = "ai_translate.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ai_translate.interfaces" = ["qml/*.qml", "qml/icons/*.svg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
